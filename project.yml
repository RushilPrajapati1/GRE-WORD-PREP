name: GREWordGroups
options:
  bundleIdPrefix: com.rushil
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
targets:
  GREWordGroups:
    type: application
    platform: iOS
    sources:
      - path: GREWordGroups
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rushil.grewordgroups
        PRODUCT_NAME: GREWordGroups
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: GRE Words
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_PREVIEWS: YES
  GREWordGroupsTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: GREWordGroupsTests
    dependencies:
      - target: GREWordGroups
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rushil.grewordgroups.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/GREWordGroups.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/GREWordGroups"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  GREWordGroups:
    build:
      targets:
        GREWordGroups: all
        GREWordGroupsTests: [test]
    test:
      gatherCoverageData: true
      targets:
        - GREWordGroupsTests
